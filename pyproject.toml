[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r3e-rtl-repair"
version = "0.1.0"
description = "R3E: red-blue adversarial evolution for RTL repair"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["r3e*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "network: requires an external model API",
]
